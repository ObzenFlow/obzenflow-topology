name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match an existing tag vX.Y.Z and Cargo.toml"
        required: true

jobs:
  preflight:                                    # release-specific checks; no environment, no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}  # tag must exist, or this fails
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked

      - name: Verify tag and manifest agree on version
        run: |
          MANIFEST=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "obzenflow-topology") | .version')
          echo "requested=${{ inputs.version }}  tag=v${{ inputs.version }}  manifest=$MANIFEST"
          [ "$MANIFEST" = "${{ inputs.version }}" ] || {
            echo "::error::Tag v${{ inputs.version }} has Cargo.toml version $MANIFEST"
            exit 1
          }

      - name: Show the shipped file set, then dry-run
        run: |
          {
            echo '### Files that will be published'
            echo '<pre>'
            cargo package --list
            echo '</pre>'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cargo publish --dry-run --locked

  # Full ci.yml parity against the tag, via the reusable workflow. dco self-skips
  # (it is pull_request-only), so this runs fmt, clippy, test, policy, and wasm.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/v${{ inputs.version }}

  publish:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    environment: release                        # required-reviewer approval gate
    permissions:
      contents: read                            # for checkout (an explicit block resets unlisted scopes to none)
      id-token: write                           # OIDC, only this job needs it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}  # same tag preflight inspected
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: rust-lang/crates-io-auth-action@v1  # short-lived token, no stored secret
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
